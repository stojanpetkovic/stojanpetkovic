<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex" />

  <title>Offline · Stojan Petkovic</title>
  <style>
    :root { color-scheme: light; }

      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #14213d;
      background: radial-gradient(120% 70% at 50% 0%, #e6eefb, #f6f8fc 70%);

    main { max-width: 26rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px -10px rgb(20 40 80 / .4); }
    h1 { margin: 1.25rem 0 .5rem; font-size: 1.4rem; }
    p { margin: .4rem 0; color: #4a5568; line-height: 1.5; }
    .sr { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #dde3ee; }
    button {
      margin-top: 1.5rem; min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: .8rem;
      background: #1f62b4; color: #fff; font: inherit; font-weight: 700;
    }
    a { color: #1f62b4; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/pwa-192x192.png" alt="" />
    <h1>You're offline</h1>

    <p class="sr" lang="sr-Latn">Niste povezani na internet. Ova strana još nije sačuvana na telefonu, a strane koje ste već otvorili i dalje rade.</p>
    <p>WhatsApp / Telefon: <a href="tel:+381638776419">+381 63 877 6419</a></p>
